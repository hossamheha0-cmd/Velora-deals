name: velora_deals_uae
description: "Velora Deals UAE — Official Shopping App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ---- State Management ----
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ---- Routing ----
  go_router: ^14.2.0

  # ---- Networking ----
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # ---- Local/Secure Storage ----
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # ---- Serialization ----
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # ---- UI / UX ----
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  flutter_rating_bar: ^4.0.1
  intl: ^0.20.3
  intl_phone_field: ^3.2.0
  pin_code_fields: ^8.0.1
  flutter_html: ^3.0.0-beta.2

  # ---- Utilities ----
  equatable: ^2.0.5
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  connectivity_plus: ^6.0.3
  flutter_dotenv: ^5.1.0
  logger: ^2.4.0

  # ---- Push Notifications (Firebase Cloud Messaging) ----
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  freezed: ^2.5.5
  riverpod_generator: ^2.4.0

  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  generate: true # يفعّل توليد ملفات الترجمة من ARB تلقائيًا (flutter gen-l10n)

  assets:
    - assets/images/
    - assets/icons/
    - .env

# ---- App Icon Generation (يُشغَّل يدويًا: flutter pub run flutter_launcher_icons) ----
# يستخدم velora_app_icon.png (الشعار المصغّر بدون النص - الأنسب لأيقونة تطبيق) وليس اللوجو
# الكامل بالاسم، لأن أيقونات المتاجر عادة مربعة صغيرة ولا تستوعب نص "Veloradeals UAE" بوضوح.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/velora_app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

# ---- Native Splash Screen (يُشغَّل يدويًا: flutter pub run flutter_native_splash:create) ----
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/velora_logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/images/velora_logo.png

dependency_overrides:
  androidx_core: 1.13.0
