workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get flutter packages
        script: |
          cd mobile-app
          flutter pub get
      - name: Build APK
        script: |
          cd mobile-app
          flutter build apk --release
    artifacts:
      - mobile-app/build/app/outputs/flutter-apk/app-release.apk
