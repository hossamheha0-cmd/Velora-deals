workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get flutter packages
        script: |
          cd VeloraDeals-UAE/mobile-app
          flutter pub get
      - name: Build APK
        script: |
          cd VeloraDeals-UAE/mobile-app
          sed -i 's/8.3.0/8.5.0/g' android/build.gradle
          sed -i 's/com.android.tools.build:gradle:8.3.0/com.android.tools.build:gradle:8.5.0/g' android/build.gradle
          flutter build apk --release
    artifacts:
      - VeloraDeals-UAE/mobile-app/build/app/outputs/flutter-apk/app-release.apk
