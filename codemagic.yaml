workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get flutter packages
        script: |
          cd VeloraDeals-UAE/mobile-app
          flutter pub get
      - name: Build APK and AppBundle
        script: |
          cd VeloraDeals-UAE/mobile-app
          flutter build apk --release
          flutter build appbundle --release
    artifacts:
      - VeloraDeals-UAE/mobile-app/build/app/outputs/flutter-apk/*.apk
      - VeloraDeals-UAE/mobile-app/build/app/outputs/bundle/release/*.aab

  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get flutter packages
        script: |
          cd VeloraDeals-UAE/mobile-app
          flutter pub get
      - name: Build iOS IPA
        script: |
          cd VeloraDeals-UAE/mobile-app
          flutter build ipa --release --no-codesign
    artifacts:
      - VeloraDeals-UAE/mobile-app/build/ios/ipa/*.ipa
