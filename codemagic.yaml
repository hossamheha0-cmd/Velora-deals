workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get flutter packages
        script: |
          cd VeloraDeals-UAE/mobile-app
          flutter pub get
      - name: Build APK Final
        script: |
          cd VeloraDeals-UAE/mobile-app
          # تمرير متغيرات البيئة لإجبار الـ Gradle على تخطي التحقق ورفع الـ AGP
          flutter build apk --release --android-skip-build-dependency-validation
    artifacts:
      - VeloraDeals-UAE/mobile-app/build/app/outputs/flutter-apk/app-release.apk
