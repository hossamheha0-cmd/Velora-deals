workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get flutter packages
        script: |
          cd VeloraDeals-UAE/mobile-app
          flutter pub get
      - name: Fix Gradle Version
        script: |
          cd VeloraDeals-UAE/mobile-app
          # تحديث نسخة الـ gradle wrapper لنسخة متوافقة وحديثة
          GRADLE_PROP="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$GRADLE_PROP" ]; then
            sed -i 's/distributionUrl=.*$/distributionUrl=https\:\/\/services.gradle.org\/distributions\/gradle-8.9-all.zip/g' "$GRADLE_PROP"
          fi
      - name: Build APK
        script: |
          cd VeloraDeals-UAE/mobile-app
          flutter build apk --release
    artifacts:
      - VeloraDeals-UAE/mobile-app/build/app/outputs/flutter-apk/app-release.apk
