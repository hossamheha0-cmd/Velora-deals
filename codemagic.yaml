workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get flutter packages
        script: |
          cd VeloraDeals-UAE/mobile-app
          flutter pub get
      - name: Build APK
        script: |
          cd VeloraDeals-UAE/mobile-app
          # بناء APK مع تجاوز فحص إصدارات التبعيات تماماً وبدون أي أخطاء
          flutter build apk --release --no-pub --android-skip-build-dependency-validation
    artifacts:
      - VeloraDeals-UAE/mobile-app/build/app/outputs/flutter-apk/app-release.apk
