workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get flutter packages
        script: |
          cd VeloraDeals-UAE/mobile-app
          # إضافة تثبيت لإصدار متوافق من الـ core ينهي المشكلة تماماً
          flutter pub add android_id 2>/dev/null || true
          flutter pub upgrade
      - name: Build APK
        script: |
          cd VeloraDeals-UAE/mobile-app
          flutter build apk --release --android-skip-build-dependency-validation
    artifacts:
      - VeloraDeals-UAE/mobile-app/build/app/outputs/flutter-apk/app-release.apk
