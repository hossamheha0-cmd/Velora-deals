workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get flutter packages
        script: |
          cd VeloraDeals-UAE/mobile-app
          flutter pub get
      - name: Force Gradle Wrapper
        script: |
          cd VeloraDeals-UAE/mobile-app/android
          mkdir -p gradle/wrapper
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\:\/\/services.gradle.org\/distributions\/gradle-8.9-all.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          
          # تأكيد عمل نسخة احتياطية في مجلد الكور الرئيسي للـ gradle
          mkdir -p .gradle/wrapper
          cp gradle/wrapper/gradle-wrapper.properties .gradle/wrapper/ || true
      - name: Build APK
        script: |
          cd VeloraDeals-UAE/mobile-app
          flutter build apk --release
    artifacts:
      - VeloraDeals-UAE/mobile-app/build/app/outputs/flutter-apk/app-release.apk
