workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get flutter packages
        script: |
          cd VeloraDeals-UAE/mobile-app
          flutter pub get
      - name: Build APK
        script: |
          cd VeloraDeals-UAE/mobile-app
          # تحديث الـ SDK داخل ملفات الـ build.gradle تلقائياً
          sed -i 's/compileSdkVersion 34/compileSdkVersion 35/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/targetSdkVersion 34/targetSdkVersion 35/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/compileSdk = 34/compileSdk = 35/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/targetSdk = 34/targetSdk = 35/g' android/app/build.gradle 2>/dev/null || true
          flutter build apk --release --android-skip-build-dependency-validation
    artifacts:
      - VeloraDeals-UAE/mobile-app/build/app/outputs/flutter-apk/app-release.apk
